<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    </head>
<body>
    <h1 class="titulo-principal"> Formulario</h1>
    <form>
        <div>
            <label for="fullname">Nombre completo: </label>
            <input type="text" id="fullname"/ required placeholder="Nicolas Rebotaro">
            <label for="DNI">DNI: </label>
            <input type="text" name="" id="DNI" required maxlength="20" minlength="3">
            <label for="codigo">Codigo:</label>
            <input type="text" id="codigo" required maxlength="10">
        </div>
        <div>
            <label for="pais"> Elige tu pais</label>
            <select name="pais" id="pais">
                <option value="AR">Argentina</option>
                <option value="FR">Francia</option>
                <option value="BR">Brasil</option>
                <option value="HAI">Haiti</option>
            </select>
        </div>
       
        <div>
            <span>Seleccione su lenguaje favorito</span>
            <div>
                <label for="html">HTML</label>
                <input type="radio" name="lenguaje_favorito" id="html">
            </div>
            <div>
                <label for="css">CSS</label>
                <input type="radio" name="lenguaje_favorito" id="css">
            </div>
            <div>
                <label for="js">JS</label>
                <input type="radio" name="lenguaje_favorito" id="js">
            </div>
        </div>
        <button class="btn"> Registrar</button>
</form>           
</body>
</html>
